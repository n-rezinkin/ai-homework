<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Трекер привычек</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --primary: #d97706;
    --primary-hover: #b45309;
    --accent: #059669;
    --accent-soft: rgba(5, 150, 105, 0.14);
    --danger: #dc2626;
    --radius: 16px;
    --radius-sm: 10px;
    --shadow: 0 1px 3px rgba(0,0,0,.08), 0 8px 24px rgba(0,0,0,.06);
    --font: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    --transition: 200ms cubic-bezier(.4,0,.2,1);
  }

  html[data-theme="light"] {
    --bg: #fffbeb;
    --bg-grad: radial-gradient(1200px 600px at 100% -10%, #fef3c7 0%, transparent 60%), #fffbeb;
    --surface: #ffffff;
    --surface-2: #fdf6ec;
    --text: #0f172a;
    --text-muted: #64748b;
    --border: #f0e2cf;
    --border-strong: #e5d4bb;
    --cell-empty: #f1e7d6;
    --cell-empty-hover: #e8d9c2;
  }

  html[data-theme="dark"] {
    --bg: #0b0d12;
    --bg-grad: radial-gradient(1200px 600px at 100% -10%, #1c1408 0%, transparent 55%), #0b0d12;
    --surface: #14171f;
    --surface-2: #1a1e28;
    --text: #f1f5f9;
    --text-muted: #94a3b8;
    --border: #232833;
    --border-strong: #2f3644;
    --cell-empty: #20252f;
    --cell-empty-hover: #2a303c;
    --shadow: 0 1px 3px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: var(--font);
    background: var(--bg-grad);
    color: var(--text);
    min-height: 100dvh;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    transition: background var(--transition), color var(--transition);
  }

  .wrap { max-width: 880px; margin: 0 auto; padding: 32px 20px 96px; }

  /* Header */
  header {
    display: flex; align-items: center; justify-content: space-between;
    gap: 16px; margin-bottom: 28px;
  }
  .brand { display: flex; align-items: center; gap: 12px; }
  .brand-mark {
    width: 44px; height: 44px; border-radius: 12px;
    background: linear-gradient(135deg, var(--primary), #f59e0b);
    display: grid; place-items: center; color: #fff;
    box-shadow: 0 6px 16px rgba(217,119,6,.35);
    flex-shrink: 0;
  }
  .brand h1 { font-size: 22px; font-weight: 700; letter-spacing: -.02em; }
  .brand p { font-size: 13px; color: var(--text-muted); }

  .icon-btn {
    width: 44px; height: 44px; border-radius: 12px;
    background: var(--surface); border: 1px solid var(--border);
    color: var(--text); cursor: pointer; display: grid; place-items: center;
    transition: var(--transition);
  }
  .icon-btn:hover { background: var(--surface-2); border-color: var(--border-strong); }
  .icon-btn:focus-visible { outline: 3px solid var(--primary); outline-offset: 2px; }

  /* Stats */
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 28px; }
  .stat {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 18px 20px; box-shadow: var(--shadow);
  }
  .stat .label { font-size: 12px; color: var(--text-muted); font-weight: 500; text-transform: uppercase; letter-spacing: .04em; }
  .stat .value { font-size: 30px; font-weight: 800; letter-spacing: -.03em; margin-top: 6px; font-variant-numeric: tabular-nums; }
  .stat .value small { font-size: 15px; font-weight: 600; color: var(--text-muted); }
  .stat.accent .value { color: var(--accent); }
  .stat.amber .value { color: var(--primary); }

  /* Add form */
  .add-row { display: flex; gap: 10px; margin-bottom: 24px; }
  .add-row input {
    flex: 1; height: 52px; padding: 0 18px; font-size: 16px; font-family: var(--font);
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-sm);
    color: var(--text); transition: var(--transition);
  }
  .add-row input::placeholder { color: var(--text-muted); }
  .add-row input:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(217,119,6,.18); }
  .btn-primary {
    height: 52px; padding: 0 22px; font-size: 15px; font-weight: 600; font-family: var(--font);
    background: var(--primary); color: #fff; border: none; border-radius: var(--radius-sm);
    cursor: pointer; display: flex; align-items: center; gap: 8px; white-space: nowrap;
    transition: var(--transition);
  }
  .btn-primary:hover { background: var(--primary-hover); transform: translateY(-1px); }
  .btn-primary:active { transform: translateY(0); }
  .btn-primary:focus-visible { outline: 3px solid var(--text); outline-offset: 2px; }

  /* Habit list */
  .habits { display: flex; flex-direction: column; gap: 14px; }
  .habit {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 18px 20px; box-shadow: var(--shadow);
    animation: pop var(--transition);
  }
  @keyframes pop { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

  .habit-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 16px; }
  .habit-name { display: flex; align-items: center; gap: 12px; min-width: 0; }
  .dot { width: 12px; height: 12px; border-radius: 50%; background: var(--primary); flex-shrink: 0; }
  .habit-name h3 { font-size: 16px; font-weight: 600; letter-spacing: -.01em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .habit-meta { display: flex; align-items: center; gap: 14px; flex-shrink: 0; }
  .streak { display: flex; align-items: center; gap: 5px; font-size: 14px; font-weight: 600; color: var(--primary); font-variant-numeric: tabular-nums; }
  .streak.zero { color: var(--text-muted); }
  .del {
    width: 34px; height: 34px; border-radius: 9px; border: 1px solid transparent;
    background: transparent; color: var(--text-muted); cursor: pointer; display: grid; place-items: center;
    transition: var(--transition);
  }
  .del:hover { color: var(--danger); background: rgba(220,38,38,.1); }
  .del:focus-visible { outline: 2px solid var(--danger); outline-offset: 1px; }

  /* Week grid */
  .week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; }
  .day { display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .day .dow { font-size: 11px; color: var(--text-muted); font-weight: 500; }
  .cell {
    width: 100%; aspect-ratio: 1; max-height: 46px; border-radius: 10px;
    background: var(--cell-empty); border: 1px solid var(--border);
    cursor: pointer; display: grid; place-items: center; color: transparent;
    transition: var(--transition); position: relative;
  }
  .cell:hover { background: var(--cell-empty-hover); }
  .cell:focus-visible { outline: 3px solid var(--primary); outline-offset: 2px; }
  .cell.done { background: var(--accent); border-color: var(--accent); color: #fff; }
  .cell.done:hover { filter: brightness(1.08); }
  .cell.today { border-color: var(--primary); border-width: 2px; }
  .cell .num { font-size: 12px; font-weight: 600; color: var(--text-muted); }
  .cell.done .num { display: none; }
  .cell svg { opacity: 0; transform: scale(.5); transition: var(--transition); }
  .cell.done svg { opacity: 1; transform: scale(1); }

  /* Empty state */
  .empty {
    text-align: center; padding: 64px 24px; border: 2px dashed var(--border-strong);
    border-radius: var(--radius); color: var(--text-muted);
  }
  .empty svg { color: var(--border-strong); margin-bottom: 16px; }
  .empty h3 { color: var(--text); font-size: 18px; font-weight: 600; margin-bottom: 6px; }
  .empty p { font-size: 14px; }

  footer { text-align: center; margin-top: 40px; font-size: 12px; color: var(--text-muted); }

  @media (max-width: 560px) {
    .wrap { padding: 24px 14px 80px; }
    .stats { gap: 8px; }
    .stat { padding: 14px; }
    .stat .value { font-size: 24px; }
    .brand p { display: none; }
    .btn-primary span { display: none; }
    .btn-primary { padding: 0 16px; }
    .week { gap: 5px; }
  }

  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <div class="brand-mark">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
      </div>
      <div>
        <h1>Трекер привычек</h1>
        <p>Отмечай каждый день и держи стрик</p>
      </div>
    </div>
    <button class="icon-btn" id="themeBtn" aria-label="Переключить тему">
      <svg id="themeIcon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></svg>
    </button>
  </header>

  <section class="stats" aria-label="Статистика">
    <div class="stat amber">
      <div class="label">Привычек</div>
      <div class="value" id="statHabits">0</div>
    </div>
    <div class="stat accent">
      <div class="label">Сегодня</div>
      <div class="value"><span id="statToday">0</span><small id="statTodayTotal">/0</small></div>
    </div>
    <div class="stat amber">
      <div class="label">Лучший стрик</div>
      <div class="value" id="statStreak">0</div>
    </div>
  </section>

  <form class="add-row" id="addForm">
    <input type="text" id="habitInput" placeholder="Новая привычка, например «Читать 20 минут»" maxlength="60" autocomplete="off" aria-label="Название привычки">
    <button type="submit" class="btn-primary">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
      <span>Добавить</span>
    </button>
  </form>

  <div class="habits" id="habitList"></div>

  <footer>Данные хранятся локально в браузере · localStorage</footer>
</div>

<script>
(function () {
  "use strict";
  const STORE_KEY = "habit-tracker-v1";
  const THEME_KEY = "habit-tracker-theme";
  const DOW = ["Пн", "Вт", "Ср", "Чт", "Пт", "Сб", "Вс"];

  const $ = (s) => document.querySelector(s);
  const listEl = $("#habitList");

  let habits = load();

  /* ---------- Date helpers (local, no timezone drift) ---------- */
  function toKey(d) {
    return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
  }
  function todayKey() { return toKey(new Date()); }

  // Last 7 days ending today (Mon-first ordering isn't needed — chronological)
  function last7() {
    const days = [];
    const now = new Date();
    for (let i = 6; i >= 0; i--) {
      const d = new Date(now.getFullYear(), now.getMonth(), now.getDate() - i);
      days.push(d);
    }
    return days;
  }

  /* ---------- Storage ---------- */
  function load() {
    try {
      const raw = localStorage.getItem(STORE_KEY);
      if (!raw) return [];
      const data = JSON.parse(raw);
      return Array.isArray(data) ? data : [];
    } catch (e) { return []; }
  }
  function save() {
    try { localStorage.setItem(STORE_KEY, JSON.stringify(habits)); } catch (e) {}
  }

  /* ---------- Streak: consecutive done days ending today (or yesterday) ---------- */
  function currentStreak(habit) {
    const done = new Set(habit.done || []);
    let streak = 0;
    const now = new Date();
    // allow the streak to still count if today isn't marked yet but yesterday is
    let start = done.has(todayKey()) ? 0 : 1;
    for (let i = start; i < 3650; i++) {
      const d = new Date(now.getFullYear(), now.getMonth(), now.getDate() - i);
      if (done.has(toKey(d))) streak++;
      else break;
    }
    return streak;
  }

  /* ---------- Rendering ---------- */
  const checkSVG = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>';

  function render() {
    const days = last7();
    const tKey = todayKey();

    // stats
    const total = habits.length;
    const doneToday = habits.filter(h => (h.done || []).includes(tKey)).length;
    const best = habits.reduce((m, h) => Math.max(m, currentStreak(h)), 0);
    $("#statHabits").textContent = total;
    $("#statToday").textContent = doneToday;
    $("#statTodayTotal").textContent = "/" + total;
    $("#statStreak").textContent = best;

    if (total === 0) {
      listEl.innerHTML = '<div class="empty">' +
        '<svg width="52" height="52" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>' +
        '<h3>Пока нет привычек</h3><p>Добавь первую привычку выше, чтобы начать отслеживать прогресс.</p></div>';
      return;
    }

    listEl.innerHTML = "";
    habits.forEach((habit) => {
      const done = new Set(habit.done || []);
      const streak = currentStreak(habit);

      const card = document.createElement("div");
      card.className = "habit";

      const cells = days.map((d) => {
        const key = toKey(d);
        const isDone = done.has(key);
        const isToday = key === tKey;
        const dow = DOW[(d.getDay() + 6) % 7];
        return '<div class="day">' +
          '<span class="dow">' + dow + '</span>' +
          '<button class="cell' + (isDone ? ' done' : '') + (isToday ? ' today' : '') + '" ' +
            'data-id="' + habit.id + '" data-date="' + key + '" ' +
            'aria-pressed="' + isDone + '" ' +
            'aria-label="' + dow + ' ' + d.getDate() + ': ' + (isDone ? 'выполнено' : 'не отмечено') + '">' +
            '<span class="num">' + d.getDate() + '</span>' + checkSVG +
          '</button>' +
        '</div>';
      }).join("");

      card.innerHTML =
        '<div class="habit-top">' +
          '<div class="habit-name"><span class="dot"></span><h3>' + escapeHtml(habit.name) + '</h3></div>' +
          '<div class="habit-meta">' +
            '<span class="streak' + (streak === 0 ? ' zero' : '') + '" title="Текущий стрик">' +
              '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"/></svg>' +
              streak +
            '</span>' +
            '<button class="del" data-del="' + habit.id + '" aria-label="Удалить привычку ' + escapeHtml(habit.name) + '">' +
              '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m3 0v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/></svg>' +
            '</button>' +
          '</div>' +
        '</div>' +
        '<div class="week">' + cells + '</div>';

      listEl.appendChild(card);
    });
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  }

  /* ---------- Actions ---------- */
  function addHabit(name) {
    name = name.trim();
    if (!name) return;
    habits.push({ id: "h" + Date.now() + Math.floor(Math.random() * 1000), name, done: [] });
    save();
    render();
  }

  function toggleDay(id, date) {
    const habit = habits.find(h => h.id === id);
    if (!habit) return;
    habit.done = habit.done || [];
    const i = habit.done.indexOf(date);
    if (i === -1) habit.done.push(date);
    else habit.done.splice(i, 1);
    save();
    render();
  }

  function deleteHabit(id) {
    const habit = habits.find(h => h.id === id);
    if (!habit) return;
    if (!confirm('Удалить привычку «' + habit.name + '»? Историю восстановить нельзя.')) return;
    habits = habits.filter(h => h.id !== id);
    save();
    render();
  }

  /* ---------- Events (delegation) ---------- */
  $("#addForm").addEventListener("submit", (e) => {
    e.preventDefault();
    const input = $("#habitInput");
    addHabit(input.value);
    input.value = "";
    input.focus();
  });

  listEl.addEventListener("click", (e) => {
    const cell = e.target.closest(".cell");
    if (cell) { toggleDay(cell.dataset.id, cell.dataset.date); return; }
    const del = e.target.closest(".del");
    if (del) { deleteHabit(del.dataset.del); }
  });

  /* ---------- Theme ---------- */
  const sun = '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>';
  const moon = '<path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8z"/>';
  function applyTheme(t) {
    document.documentElement.setAttribute("data-theme", t);
    $("#themeIcon").innerHTML = t === "dark" ? sun : moon;
  }
  $("#themeBtn").addEventListener("click", () => {
    const next = document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark";
    try { localStorage.setItem(THEME_KEY, next); } catch (e) {}
    applyTheme(next);
  });

  /* ---------- Init ---------- */
  let savedTheme;
  try { savedTheme = localStorage.getItem(THEME_KEY); } catch (e) {}
  applyTheme(savedTheme || "dark");
  render();
})();
</script>
</body>
</html>
